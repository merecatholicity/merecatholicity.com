# merecat-local dials. The offline GPU twin of the Cloudflare librarian.
# No caps, no budget: the whole corpus is vectorized and the answers run long.
# Edit and re-run ./merecat — build_index.py only needs re-running when the
# sources or the embed model change.

ollama_url: "http://127.0.0.1:11434"
rerank_url: "http://127.0.0.1:8181"     # llama.cpp --reranking (CPU); optional

# The abliterated (refusal-removed) twin of the same 30B-A3B MoE — the owner's
# 2026-07-29 anti-censorship ruling. Same architecture, speed, and VRAM shape
# as qwen3:30b-a3b (kept in ~/.ollama for rollback: one line here + restart).
chat_model: "huihui_ai/qwen3-abliterated:30b"
embed_model: "bge-m3"                    # 1024-dim, same as Cloudflare (parity)
embed_dim: 1024
num_ctx: 20480                          # room for a bounded ~12k prompt PLUS a
                                        # deep think and a long answer (16k once
                                        # ran dry mid-reasoning: empty answer)
num_thread: 8                           # of 12 cores: the desk stays usable
                                        # while expert tensors run on CPU

# Retrieval. The whole corpus has vectors now, so the vector leg casts wide
# and the reranker sorts it. topk up from the worker's 8 — no token budget.
vector_topk: 48                         # candidates from the semantic leg
pool_cap: 120                           # merged-pool ceiling before rerank
topk: 12                                # chunks handed to the model
rerank: true
rerank_pair_budget: 1400                # max query+document tokens per rerank
                                        # pair, enforced token-exactly before
                                        # send (llm.py trims; the server's
                                        # physical batch is 2048 — keep this
                                        # comfortably below it). One 703-token
                                        # Greek-dense pair over the old 512
                                        # batch once killed whole reranks
                                        # (2026-07-29): see README.
phrase_seats: 3                         # guaranteed verbatim-phrase/verse seats

think: false                            # true = print the model's <think> span
site: "https://merecatholicity.com/"

# The LOCAL system prompt. Its own file, used verbatim, wholly separate from
# the Cloudflare persona.md — edit it to change the local voice, no rebuild.
persona_file: "persona.local.md"

# Paths are resolved relative to this file's directory (local/).
librarian: "../librarian"               # the shared sources + persona.md
data_dir: "data"                        # git-ignored derived state

# the local HTTP service (serve.py) port; Tailscale Funnel points here
serve_port: 8790

# Where serve.py reports a finished 1-on-1 answer so it lands on the thread even
# if the reader disconnected mid-stream. The worker's /store endpoint, keyed by
# the shared local key (same secret as X-Merecat-Key). Empty disables callback.
store_url: "https://merecatholicity.com/api/merecat/store"
