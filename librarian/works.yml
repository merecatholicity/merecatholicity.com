# The librarian's manifest: every work merecat knows, one entry each.
# Edit this file, then run the daily push from the repo root:
#   cd librarian && python ingest.py --push
# Only works whose source content (or entry) changed are re-pushed; entries
# removed here are pruned from the bot; sources not yet built are skipped
# with a note and picked up by a later run; and every run audits this
# manifest against library.html so nothing on the shelf goes missing here.
#
# Fields: src (source file), url (page citations link to), title, kind
# (pandoc | hand | bible | text), vectorize (band-1 only; ~4,880-vector
# free budget, warned on), and tier — the six weight bands of the shelf:
#   1  the site's works and its catechetical core (vectorized, top boost)
#   2  the Scriptures
#   3  the named works of the Fathers (and the Catena)
#   4  the seven councils and the documents of the schism
#   5  the deep shelf: the Schaff sets and the Summa
#   6  Newman entire (boosted above the deep shelf; the persona carries
#      the site's reading of him)
# The Douay-Rheims is deliberately absent: the KJV serves, and redundancy
# costs budget.

