# The librarian's manifest: every work merecat knows, one entry each.
# Edit this file, then run `make librarian` from the repo root. Only works
# whose source content (or entry) changed are re-pushed.
#
# Fields:
#   src       path to the source file, relative to this directory
#   url       the reader-facing page the citations link to
#   title     how the work is named in citations
#   tier      1 = the site's positions (vectorized, boosted, framed as ours)
#             2 = the evidence shelf   3 = the deep corpus
#   kind      parser: pandoc (generated pages with .unnumbered headings)
#             hand (hand-authored site pages with semantic ids)
#             bible (kjv.json / dr.json)   text (plain txt/md, e.g. extra/)
#   vectorize true to also store semantic vectors (Tier 1 only — the free
#             Vectorize plan holds ~4,880 vectors; ingest.py warns on budget)
#
# To add content: add an entry here (or drop a .txt/.md in extra/ and list
# it with kind: text), then `make librarian`. To remove: delete the entry
# and run `make librarian` — the push prunes works no longer listed.

