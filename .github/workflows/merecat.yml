# merecat, the librarian, built by the pipeline.
#
# Until 2026-09-10 the librarian's shelf was fed by hand: `make librarian` on
# the owner's machine, which parses the built site and the private shelf into
# chunks and pushes only the works whose chunks changed (the server keeps a
# hash per work). This moves that road into the pipeline. A push to main that
# touches what merecat is made of — its mind (librarian/**: the manifest, the
# persona, the dials) or the library it reads (the hand pages, the corpus
# sources, the book, the partials that ride into every page) — runs the same
# ingest here, against the site the Build workflow just produced. A daily run
# finishes anything a day's D1 write budget cut short, prunes works that left
# the manifest, and picks up the private shelf. The private shelf's own pushes
# reach this workflow by `workflow_dispatch` from a one-line workflow in that
# repository (docs/architecture/CICD.md §4 names the token).
#
# What makes it cheap: the parse ledger (librarian/.ledger.json, cached
# between runs) remembers every source's signature, so an unchanged work is
# not parsed again; the server's hash means an unchanged work is not pushed
# again; and a run that stops at the row budget exits 0 and says so in the
# job summary — the next run resumes for free.
#
# What it needs, and what it does NOT: the built docs/ tree (restored from the
# Build workflow's cache — an EXACT hit is required; a fallback would ingest
# an older site); the private shelf (a read-only deploy key, PRIVATE_SHELF_DEPLOY_KEY;
# absent, its 31 works are skipped, never pruned). No credential for the
# worker (2026-09-17): each job asks GitHub for its OIDC token (`id-token:
# write`), and the worker checks GitHub's signature and the claims —
# this repository, main, this file, a push, schedule or dispatch
# (comments-worker/src/oidc.ts, Domain.Pipeline). No Cloudflare token either.
# It reaches the worker on its workers.dev hostname, because the zone's Bot
# Fight Mode turns a GitHub runner away and cannot be skipped on the Free plan;
# that hostname serves nothing but the pipeline doors. Never on a pull_request.
#
# The persona and the dials travel apart from the corpus. `config-status`
# asks whether persona.md or config.yml differs from what the server last
# took; when one does, `config` runs in the `librarian-config` environment —
# it waits for a required reviewer (Review deployments, or
# scripts/ci_approve.sh) — and the worker takes the persona and the dials
# from no other job. `config: force` on a dispatch pushes both (the drill).

name: merecat

on:
  push:
    branches: [main]
    paths:
      - 'librarian/**'
      - 'content/**'
      - 'resources/**'
      - 'book/**'
      - 'partials/**'
      - 'scripts/content.py'
      - 'scripts/nav.py'
      - '.github/workflows/merecat.yml'
  schedule:
    - cron: '10 4 * * *'   # 04:10 UTC daily: resume a budgeted ingest, prune, take the private shelf
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why (e.g. private-shelf push, or a hand run)'
        required: false
        default: ''
      only:
        description: 'Comma list of work ids to ingest, or empty for the whole manifest'
        required: false
        default: ''
      config:
        description: 'force = push persona.md and config.yml even if unchanged (after review); empty = only what changed'
        required: false
        default: ''

permissions:
  contents: read

env:
  MERECAT_API: ${{ vars.MERECAT_INGEST_API || 'https://merecatholicity-comments.support-609.workers.dev/api/merecat' }}

jobs:
  ingest:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
    # per job, not per run: a config job waiting days for its reviewer must
    # never hold the daily ingest behind it
    concurrency:
      group: merecat-ingest
      cancel-in-progress: false
    env:
      # true/false only — the secret's presence, never its value
      HAVE_SHELF_KEY: ${{ secrets.PRIVATE_SHELF_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Which site to ingest against
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The ingest reads the BUILT site. On a push that is this commit's
          # Build; wait for it (it is running alongside this workflow). On a
          # schedule or a dispatch it is the newest successful Build on main.
          #
          # A Build CANCELLED because a newer merge started its own (build.yml
          # cancels in progress) is not a failure: that newer Build carries
          # this commit, so the ingest follows it (2026-10-09; until then every
          # burst of merges turned this run red and the ingest waited for a
          # hand dispatch). A Build that FAILED is the end: there is no site.
          if [ "${{ github.event_name }}" = "push" ]; then
            sha="${{ github.sha }}"
            for i in $(seq 1 120); do
              st=$(gh run list --workflow Build --branch main --limit 20 --json headSha,status,conclusion \
                     --jq ".[] | select(.headSha==\"$sha\") | \"\(.status) \(.conclusion)\"" | head -1)
              case "$st" in
                "completed success") break ;;
                "completed cancelled")
                  git fetch -q origin main
                  tip=$(git rev-parse origin/main)
                  if [ "$tip" != "$sha" ] && git merge-base --is-ancestor "$sha" "$tip"; then
                    echo "::notice::the Build of $sha was superseded; ingesting against the site built from $tip, which carries it"
                    sha=$tip
                    git checkout -q "$sha"
                    continue
                  fi
                  echo "::error::the Build of $sha was cancelled and nothing newer on main carries it — nothing to ingest against"; exit 1 ;;
                completed*) echo "::error::the Build of $sha ended with: $st — nothing to ingest against"; exit 1 ;;
              esac
              sleep 15
            done
            if [ "$st" != "completed success" ]; then echo "::error::the Build of $sha did not finish in 30 minutes"; exit 1; fi
          else
            sha=$(gh run list --workflow Build --branch main --status success --limit 1 --json headSha --jq '.[0].headSha')
            [ -n "$sha" ] || { echo "::error::no successful Build on main to ingest against"; exit 1; }
            git checkout -q "$sha"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ingesting against the site built from $sha"

      - name: Restore the built site (exact hit required)
        id: docs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs
          key: site-2-${{ steps.site.outputs.sha }}

      - name: The commit wins over the cache for everything git tracks
        run: |
          if [ "${{ steps.docs.outputs.cache-hit }}" != "true" ]; then
            echo "::error::no site cache for ${{ steps.site.outputs.sha }} — the ingest reads the built pages and will not guess from an older build"
            exit 1
          fi
          git checkout -- docs
          git clean -fd -- docs

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - run: python3 -m pip install --quiet pyyaml

      - name: The private shelf (read-only deploy key; skipped when absent, never pruned)
        if: env.HAVE_SHELF_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: merecatholicity/private-shelf
          ssh-key: ${{ secrets.PRIVATE_SHELF_DEPLOY_KEY }}
          path: librarian/private
          persist-credentials: false

      - name: The parse ledger
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: librarian/.ledger.json
          key: merecat-ledger-${{ github.run_id }}
          restore-keys: merecat-ledger-

      - name: Ingest (the corpus; the job's OIDC token is its credential)
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -d librarian/private ]; then echo "private shelf present"; else echo "::notice::no private shelf: its works are skipped this run (skipping never prunes)"; fi
          # `only` is a dispatcher's text: work ids and commas, one argument — never
          # a way to add flags (an --api of their choosing would receive the job's token)
          set --
          if [ -n "$ONLY" ]; then
            case "$ONLY" in
              *[!a-z0-9,-]*) echo "::error::only takes work ids (a-z, 0-9, -) separated by commas"; exit 1 ;;
            esac
            set -- --only "$ONLY"
          fi
          # paths are relative to librarian/, where the script runs; the cache key above names the same file from the root
          cd librarian && python3 ingest.py --push --api "$MERECAT_API" --ledger .ledger.json --summary "$GITHUB_STEP_SUMMARY" "$@"

  config-status:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      changed: ${{ steps.status.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - run: python3 -m pip install --quiet pyyaml

      - name: Do persona.md or config.yml differ from the server?
        id: status
        run: cd librarian && python3 ingest.py --config-status --api "$MERECAT_API" --summary "$GITHUB_STEP_SUMMARY"

  ask:
    # GitHub tells no one of their own activity, and every run here is the
    # owner's, so the gate's wait never reached them: the bot asks by name in
    # an "Approval needed" issue (scripts/ci_ask_review.sh), and the merged pull
    # request's pipeline report shows the wait in its thread. Same needs and same
    # condition as the gate; `settle` closes the issue when the gate is done.
    needs: config-status
    if: needs.config-status.outputs.changed == 'true' || github.event.inputs.config == 'force'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write          # the "Approval needed" issue
      pull-requests: write   # the pull request's report shows the wait
      actions: read
    outputs:
      issue: ${{ steps.ask.outputs.issue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci_ask_review.sh
            scripts/ci_pr_report.py
          sparse-checkout-cone-mode: false

      - name: Ask the reviewer
        id: ask
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: scripts/ci_ask_review.sh

  settle:
    # The ask's issue closes with the gate's outcome (approved, rejected, or
    # never reviewed) — whatever became of the gated job, hence always().
    needs: [ask, config]
    if: always() && needs.ask.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write          # the issue's outcome and its close
      pull-requests: write   # the pull request's report shows the outcome
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci_ask_review.sh
            scripts/ci_pr_report.py
          sparse-checkout-cone-mode: false

      - name: Settle the ask
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.ask.outputs.issue }}
          RESULT: ${{ needs.config.result }}
        run: scripts/ci_ask_review.sh close

  config:
    needs: config-status
    if: needs.config-status.outputs.changed == 'true' || github.event.inputs.config == 'force'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the reviewer's gate: the worker takes a persona or dials push only from
    # a job whose token names this environment (terraform/github.tf)
    environment: librarian-config
    permissions:
      contents: read
      id-token: write
    # a newer change supersedes one still waiting for its reviewer
    concurrency:
      group: merecat-config
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - run: python3 -m pip install --quiet pyyaml

      - name: Push the persona and the dials (approved)
        env:
          FORCE: ${{ github.event.inputs.config == 'force' && '--force' || '' }}
        run: cd librarian && python3 ingest.py --config --api "$MERECAT_API" --summary "$GITHUB_STEP_SUMMARY" $FORCE
