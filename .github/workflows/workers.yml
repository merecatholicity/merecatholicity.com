# The two Cloudflare Workers, deployed from CI.
#
# Until 2026-09-09 the comments worker shipped only by `make worker-deploy` on
# the owner's machine. This moves that road into the pipeline: a merge to main
# that changes anything a worker is built from runs the same gates (`make
# jscheck` = psbuild + tsc; `make tests`), applies the D1 migration ledger, and
# deploys. A pull request runs the gates and a `wrangler deploy --dry-run` per
# worker and touches nothing.
#
# NO PATH FILTER (2026-10-09). `check` is a required check on main (the ruleset
# in terraform/github.tf), and a workflow a path filter skips never reports:
# the pull request would wait at "Expected" for ever. So every event runs, and
# the `scope` job decides (scripts/ci_scope.py): on a pull request, whether it
# touches a worker input at all — `check` skips itself when not, which GitHub
# counts as a pass; on main, whether anything a worker is built from changed
# since the LAST SUCCESSFUL deploy, so a run cancelled in a burst of merges, or
# a red one fixed elsewhere, is carried by the next merge. The list of inputs
# is wider than the old filter: the purs pin, and the content/ pages whose list
# is compiled into the worker's comments whitelist (Domain.Writings).
#
# What stays OUTSIDE the pipeline, on purpose:
#   * worker SECRETS (`wrangler secret put`) — never in git, never in CI;
#   * the librarian ingest — its own workflow since 2026-09-10 (merecat.yml);
#   * `make worker-deploy` itself survives as the manual/emergency road.
#
# The migration ledger is applied BEFORE the deploy. Every migration in this
# repository is additive (IF NOT EXISTS / ALTER / table-swap), which is what
# makes that order safe for the worker version still running for those seconds.

name: Workers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'deploy = the normal push road; stage = upload a Version and send `percent` of traffic to it; promote = 100% to the newest Version (CICD.md §12)'
        type: choice
        options: [deploy, stage, promote]
        default: deploy
      percent:
        description: 'For stage: the share of traffic the new Version gets (1-99)'
        required: false
        default: '10'

permissions:
  contents: read

# Deploys queue; a deploy in flight is never cancelled. A pull request's runs
# are their own group: a newer push to the PR cancels its older check, and no
# check waits behind a deploy — or, as one group did, behind four Dependabot
# PRs that cancelled each other's pending checks.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('workers-pr-{0}', github.ref) || 'workers' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read   # the commit of the last successful deploy
    outputs:
      workers: ${{ steps.scope.outputs.workers }}
      contact: ${{ steps.scope.outputs.contact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - run: python3 -m pip install --quiet pyyaml

      - name: What does this run have to check and ship?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            pull_request)
              # HEAD is the PR merged into its base, so its first parent IS the base
              base=$(git rev-parse -q --verify 'HEAD^2' >/dev/null && git rev-parse 'HEAD^1' || echo "$PR_BASE") ;;
            push)
              # what is deployed: the newest successful run on main (a run that
              # shipped, or one that found nothing to ship since the one before)
              base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/workers.yml/runs?branch=main&status=success&per_page=50" \
                       --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0].head_sha // ""') ;;
            *) base= ;;
          esac
          if [ -n "$base" ]; then
            echo "base: $base"
            python3 scripts/ci_scope.py workers --base "$base"
          else
            python3 scripts/ci_scope.py workers --all
          fi
          grep -h '^why=' "$GITHUB_OUTPUT" | sed 's/^why=/**Workers scope:** /' >> "$GITHUB_STEP_SUMMARY"

  check:
    # Required on main. Skipped (a pass) only when `scope` SAID no: a scope that
    # failed leaves no answer, and then the gates run anyway.
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.workers != 'no' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc
          python3 -m pip install --quiet pyyaml

      - run: npm ci

      # The PureScript compiler is a release binary fetched by pinned sha256
      # (scripts/toolchain.py, tests/_support/toolchain.json — 2026-09-17), not
      # an npm package: cached under the pin file's hash, fetched on a miss.
      - name: Restore the PureScript compiler
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: local/bin
          key: purs-bin-${{ hashFiles('tests/_support/toolchain.json') }}

      - name: Fetch the PureScript compiler
        run: make toolchain

      - name: Restore the PureScript output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: purescript/output
          key: purs-${{ hashFiles('purescript/src/**', 'purescript/spago.yaml', 'package-lock.json', 'tests/_support/toolchain.json') }}

      # `make tests` is not entirely hermetic: tests/css reads the built
      # stylesheet, tests/py/test_partials_baked + test_librarian_sources read
      # the built corpus, and test_stamp_versions compares the keys the commit
      # carries against the bundles on disk. build.yml builds all of that
      # before it tests; this job restores what build.yml cached (restore-only
      # — build.yml is the one that saves), always rebuilds the stylesheet AND
      # the bundles so every freshness test compares like with like (the
      # cache's bundles are the PREVIOUS commit's, and once the tracked pages
      # are this commit's the old keys no longer match — 2026-09-09), and only
      # on a cold cache builds the corpus.
      - name: Restore the built site
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs
          key: site-2-${{ github.sha }}
          restore-keys: site-2-

      - name: The commit wins over the cache for everything git tracks
        run: |
          # The cache is the previous build's whole docs/ tree, hand files
          # included; the gates below must read THIS commit's copies (see the
          # same step in build.yml, 2026-09-09).
          git checkout -- docs
          git clean -fd -- docs

      - name: Build what the tests read
        run: |
          make css
          make bundle
          if [ ! -f docs/book.html ]; then
            echo "::notice::site cache miss — building the site so the corpus tests have something to read"
            make logos      # make html ends with linkcheck, and logos.html links the .docx (2026-09-09)
            make content
            make html
          fi

      - name: Gates
        run: |
          make jscheck
          make tests

      - name: Dry-run both deploys (no credentials needed)
        run: |
          (cd comments-worker && npx wrangler deploy --dry-run --outdir /tmp/cw-dry)
          (cd contact-worker  && npx wrangler deploy --dry-run --outdir /tmp/ct-dry)
          echo "comments worker bundle: $(du -sh /tmp/cw-dry | cut -f1)"

  deploy:
    # only on scope's explicit yes, and only after the gates passed
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.scope.outputs.workers == 'yes' && needs.check.result == 'success' }}
    needs: [scope, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The PureScript compiler is a release binary fetched by pinned sha256
      # (scripts/toolchain.py, tests/_support/toolchain.json — 2026-09-17), not
      # an npm package: cached under the pin file's hash, fetched on a miss.
      - name: Restore the PureScript compiler
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: local/bin
          key: purs-bin-${{ hashFiles('tests/_support/toolchain.json') }}

      - name: Fetch the PureScript compiler
        run: make toolchain

      - name: Restore the PureScript output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: purescript/output
          key: purs-${{ hashFiles('purescript/src/**', 'purescript/spago.yaml', 'package-lock.json', 'tests/_support/toolchain.json') }}

      - name: Compile the kernel
        run: make psbuild

      - name: Apply the D1 migration ledger, then deploy
        env:
          # The one account token. Blank on a pull request: PR-authored code
          # never sees a credential, and this job does not run on one anyway.
          CLOUDFLARE_API_TOKEN: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_ROOT_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '6093bc0889c95a08f0a92a8df6750c66' }}
          CONTACT: ${{ needs.scope.outputs.contact }}
          # staged rollout (workflow_dispatch only; a push is always `deploy`)
          MODE: ${{ github.event.inputs.mode || 'deploy' }}
          PERCENT: ${{ github.event.inputs.percent || '10' }}
          MC_STAGE_MESSAGE: 'staged from workers.yml by ${{ github.actor }} (${{ github.sha }})'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_ROOT_TOKEN not set — the gates passed and NOTHING was deployed. One account token, and it is absent — set it with \`gh secret set CLOUDFLARE_ROOT_TOKEN\`."
            exit 1
          fi
          cd comments-worker
          npx wrangler d1 migrations apply merecatholicity-comments --remote
          cd ..
          case "$MODE" in
            stage)   scripts/worker_stage.sh stage "$PERCENT" ;;
            promote) scripts/worker_stage.sh promote ;;
            *)       (cd comments-worker && npx wrangler deploy) ;;
          esac
          if [ "$CONTACT" = "yes" ]; then
            (cd contact-worker && npx wrangler deploy)
          else
            echo "contact worker unchanged — not redeployed"
          fi

      - name: The API still answers
        run: |
          code=$(curl -s -o /tmp/config.json -w '%{http_code}' -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128.0' https://merecatholicity.com/api/comments/config || true)
          echo "GET /api/comments/config -> $code"
          # Bot Fight Mode may 403 a runner; only a 5xx or a malformed body is a verdict.
          if [ "$code" = "200" ]; then python3 -c "import json;d=json.load(open('/tmp/config.json'));assert d.get('ok') is True;print('config ok, apiVersion', d.get('apiVersion'))"; fi
          case "$code" in 5*) echo "::error::the worker answers $code after deploy"; exit 1 ;; esac
