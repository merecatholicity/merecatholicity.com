# Build the site in CI, so a local toolchain is optional.
#
# The point: clone, change a line, open a PR. The pipeline builds what that
# change actually affects and proves the result — no TeX Live, no pandoc, no
# purs on the contributor's machine.
#
# Two things about this repo make that practical:
#
#   * It is PUBLIC, so Actions minutes are free and unlimited on standard
#     runners. Compute is not the constraint here; wall-clock is.
#   * The build is properly incremental now (2026-09-08). The corpus HTML used
#     to rebuild all ~235 works on every run — about 35 minutes of pandoc —
#     because the targets were `for` loops with no prerequisites. One target per
#     work later, an unchanged tree rebuilds nothing in 0.08 s.
#
# TWO CI-SPECIFIC TRAPS, both handled below:
#
#   1. A fresh checkout gives every file the same mtime, so make would see a
#      changed .tex as no newer than its .html and rebuild NOTHING. The changed
#      files are touched forward explicitly, from the diff.
#   2. TeX Live is ~2 GB and slow, and most changes never touch a .tex. It is
#      installed only when the diff says LaTeX is actually involved.

name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # The deploy job purges the edge and wants to name the build it is
      # purging for. docs/version.json is no longer in git — the build writes
      # it — so a workflow that only checks out the repo cannot read it. It is
      # handed downstream from here instead.
      build_id: ${{ steps.buildid.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Two commits deep is enough to diff a push; a PR is diffed against
          # its merge base, which the fetch below resolves.
          fetch-depth: 0

      - name: Work out what actually changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # A first push to a branch has no usable base; treat that as "all".
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base — treating everything as changed"
            echo "files=ALL" >> "$GITHUB_OUTPUT"
            echo "latex=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$base" HEAD > /tmp/changed.txt
          echo "changed files: $(wc -l < /tmp/changed.txt)"
          sed 's/^/  /' /tmp/changed.txt | head -40
          echo "files=list" >> "$GITHUB_OUTPUT"
          if grep -qE '\.(tex|sty)$|^book/|^resources/.*\.py$' /tmp/changed.txt; then
            echo "latex=yes" >> "$GITHUB_OUTPUT"
          else
            echo "latex=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Teach make what changed
        run: |
          # THE TRAP. git writes every file at checkout time, so a modified .tex
          # and its committed .html arrive with the same mtime and make, which
          # rebuilds only when a prerequisite is strictly NEWER, would do
          # nothing at all. Touching the changed files forward restores the
          # ordering the local working tree would have had.
          # Flatten first, THEN raise the changed files. git writes everything
          # at checkout time but in no guaranteed order, so a .tex can land a
          # microsecond after its .html and make — which rebuilds when a
          # prerequisite is strictly newer — will rebuild it for no reason. The
          # first CI run rebuilt the entire Newman corpus that way. Setting one
          # old timestamp across the tree makes the comparison deterministic;
          # the diff then decides what is actually new.
          find . -path ./.git -prune -o -path ./node_modules -prune -o \
                 -type f -exec touch -t 200001010000 {} +
          if [ "${{ steps.changed.outputs.files }}" = "ALL" ]; then
            find . -name '*.tex' -not -path './node_modules/*' -exec touch {} +
          else
            # `if`, not `&&`: the step runs under `bash -e`, and a diff that ends
            # in a DELETED file made the final `[ -e "$f" ]` false, which failed the
            # whole step. The commit that removed docs/ from git was 581 deletions,
            # so it failed on its own success.
            while read -r f; do
              if [ -e "$f" ]; then touch "$f"; fi
            done < /tmp/changed.txt
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc
          python3 -m pip install --quiet pyyaml

      - name: TeX Live (only when LaTeX is involved)
        if: steps.changed.outputs.latex == 'yes'
        run: |
          sudo apt-get install -y -qq \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra \
            texlive-lang-greek lmodern
          # textalpha/LGR (the Greek in the Fathers) and mathpazo, tcolorbox,
          # titlesec, needspace, enumitem, microtype all come from those sets.

      - run: npm ci

      - name: Restore the PureScript output
        uses: actions/cache@v4
        with:
          path: purescript/output
          key: purs-${{ hashFiles('purescript/src/**', 'purescript/spago.yaml', 'package-lock.json') }}

      - name: Restore the built site
        uses: actions/cache@v4
        with:
          # docs/ is no longer in git, so without this every run rebuilds the
          # whole corpus from nothing — correct, but twenty minutes of pandoc.
          # Restoring the previous build lets make do what it does well and
          # touch only what changed. A MISS COSTS TIME, NEVER CORRECTNESS: the
          # build from cold is the same build, just slower.
          path: docs
          key: site-${{ github.sha }}
          restore-keys: site-

      - name: Build the client and the stylesheet
        run: |
          # `make bundle` compiles PureScript, the shell and the client; the
          # Tailwind stylesheet is its own target and was never part of it. With
          # style.css no longer committed, a clean tree has to build it — every
          # page links it, so linkcheck failed on all 274 at once.
          make css
          make bundle

      - name: Build the PDFs
        if: steps.changed.outputs.latex == 'yes'
        run: make -C resources pdf

      - name: Build the site
        run: |
          # `make content` first: it renders the ~30 hand pages (index, credo,
          # about, objections...) out of content/ into docs/. `make html` builds
          # the book and the corpus and then post-processes EVERY page, so on a
          # clean tree — which is now what CI always has — sync-index reached for
          # docs/index.html before anything had written it. Locally this never
          # showed, because the pages were already sitting there from before.
          make content
          make html

      - name: Gates
        run: |
          make tests
          make jscheck
          make check

      - name: Did the build change anything the commit did not carry?
        run: |
          # While docs/ is still committed, a PR that edits a source without
          # rebuilding leaves stale output. This says so plainly rather than
          # letting a stale page ship. Once docs/ leaves git (Pages served from
          # this workflow's artifact) the question stops existing.
          if ! git diff --quiet -- docs/; then
            echo "::warning::the build produced output this commit does not carry:"
            git diff --stat -- docs/ | tail -20
            echo "This is expected while docs/ is committed and CI does the building."
          else
            echo "committed output matches a fresh build"
          fi

      - name: The artifact must carry CNAME and .nojekyll
        run: |
          # Losing CNAME from the served folder once unbound the custom domain
          # and 404'd the entire site ("Site not found - GitHub Pages"). When
          # Pages is served from an artifact rather than a branch, the artifact
          # IS the served folder, so the check belongs here.
          test -f docs/CNAME || { echo "::error::docs/CNAME is missing"; exit 1; }
          test -f docs/.nojekyll || { echo "::error::docs/.nojekyll is missing"; exit 1; }
          echo "CNAME -> $(cat docs/CNAME)"

      - name: Name the build being shipped
        id: buildid
        run: |
          build=$(python3 -c "import json;print(json.load(open('docs/version.json'))['build'])")
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "shipping build $build"

      # The PDFs are served from R2 (files.merecatholicity.com), and a Cloudflare
      # dynamic redirect sends /<name>.pdf there, so a copy sitting on Pages is
      # unreachable by construction. Shipping it anyway is not free:
      #
      #   * it re-inflates the artifact 113 MB -> 400 MB, and the whole reason
      #     the PDFs left docs/ was that the site had reached 621 MB against a
      #     HARD 1 GB Pages limit;
      #   * it makes the deploy non-deterministic in content, because whether
      #     the PDFs exist depends on whether the PREVIOUS push happened to
      #     touch a .tex (which is what decides the build-PDFs step above).
      #
      # They are moved aside rather than deleted, and put back below, so the
      # docs/ cache still carries them and the next LaTeX change rebuilds one
      # PDF instead of all 244.
      #
      # NOTE what this does NOT do: nothing here uploads a rebuilt PDF to R2.
      # That is still a manual `wrangler r2 object put ... --remote`. A LaTeX
      # change therefore builds a corrected PDF that nothing serves until it is
      # uploaded by hand.
      - name: Hold the PDFs back from the artifact
        run: |
          mkdir -p /tmp/heldpdfs
          count=$(ls docs/*.pdf 2>/dev/null | wc -l)
          if [ "$count" -gt 0 ]; then
            mv docs/*.pdf /tmp/heldpdfs/
            echo "held $count PDFs out of the artifact (they are served from R2)"
          else
            echo "no PDFs in docs/ — nothing to hold back"
          fi

      - name: Package the site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # Back into docs/ so the cache saved at the end of this job keeps them.
      - name: Return the PDFs to the cached tree
        if: always()
        run: |
          count=$(ls /tmp/heldpdfs/*.pdf 2>/dev/null | wc -l)
          if [ "$count" -gt 0 ]; then
            mv /tmp/heldpdfs/*.pdf docs/
            echo "returned $count PDFs to docs/ for the build cache"
          fi

  # Deploy only from main, and only after the build above proved itself. A pull
  # request — including one from a fork, which cannot read secrets at all —
  # builds and is checked, and never touches production.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

      # THE PURGE BELONGS HERE, and only here. It used to live in its own
      # workflow triggered by `page_build` — GitHub's signal that a BRANCH
      # build finished. Pages is deployed from this workflow's artifact now
      # (build_type: workflow), so page_build stopped firing the moment that
      # switch was thrown, and `pages/builds/latest` froze at the last branch
      # build for ever. The purge went quietly dead with it.
      #
      # The old workflow also spent a minute confirming the origin was serving
      # the new build, because purging BEFORE Pages publishes re-caches the OLD
      # bytes under a key Cloudflare treats as immutable. That confirmation is
      # free here: deploy-pages above polls until GitHub reports the deployment
      # SUCCEEDED, so by this step the content is published by definition.
      #
      # Almost nothing needs purging any more — every asset carries a
      # content-hash key (scripts/stamp_versions.py). What is left is the two
      # files that cannot: sw.js, whose URL is its service-worker registration
      # identity, and version.json, which is the answer to "what is current"
      # and so must never be served from the cache it describes.
      - name: Purge the two files that cannot carry a cache key
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          WANT: ${{ needs.build.outputs.build_id }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ZONE" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID not set — skipping the purge."
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "The token needs one permission: Zone -> Cache Purge -> Purge."
            echo "Until then sw.js and version.json heal on their 10-minute TTL,"
            echo "and every other asset is content-keyed and needs no purge at all."
            exit 0
          fi
          echo "purging the edge for build ${WANT:-unknown}"
          resp=$(curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZONE}/purge_cache" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":[
              "https://merecatholicity.com/sw.js",
              "https://merecatholicity.com/version.json",
              "https://www.merecatholicity.com/sw.js",
              "https://www.merecatholicity.com/version.json"
            ]}')
          echo "$resp"
          python3 -c "import json,sys;d=json.loads(sys.argv[1]);sys.exit(0 if d.get('success') else 1)" "$resp"
