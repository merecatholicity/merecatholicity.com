# A manual button to purge the Cloudflare edge.
#
# THE AUTOMATIC PURGE DOES NOT LIVE HERE ANY MORE. It is the last step of the
# `deploy` job in build.yml, because that is the one place that knows Pages has
# actually published — and purging BEFORE it publishes re-caches the OLD bytes
# under a key Cloudflare treats as immutable, which freezes a rollout until the
# key is bumped again.
#
# This file used to hold that purge and trigger on `page_build`. That was
# correct while Pages was served from the branch. It stopped being correct the
# moment Pages moved to this repository's workflow artifact (2026-09-08):
# `page_build` is the signal for a BRANCH build and never fires again, and the
# fallback this workflow asked instead — `pages/builds/latest` — froze at the
# last branch build, so it could never confirm a new commit either. It also
# read the expected build id out of `docs/version.json`, which left git in the
# same change. Three ways dead at once, and silently, because with no
# CLOUDFLARE_API_TOKEN set it had always been skipping cleanly anyway.
#
# What is left for a human to press: the rare case of wanting the edge cleared
# without a deploy — an edge rule changed, or something is being served stale
# that should not be. Do not run this while a Build is mid-deploy.
#
# SETUP (one time, by the repository owner — shared with the automatic purge):
#   1. Cloudflare -> My Profile -> API Tokens -> Create Token, with the single
#      permission  Zone -> Cache Purge -> Purge  on merecatholicity.com.
#   2. Repo -> Settings -> Secrets and variables -> Actions -> New secret:
#        CLOUDFLARE_API_TOKEN   the token from step 1
# Until both exist this skips cleanly rather than failing, so the repository is
# never red for a feature that has not been switched on.

name: Purge the Cloudflare edge (manual)

on:
  workflow_dispatch:
    inputs:
      everything:
        description: "Purge the WHOLE zone instead of just sw.js and version.json"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: purge-cache
  cancel-in-progress: true

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The zone id is public: an Actions VARIABLE Terraform manages, not a secret.
          ZONE: ${{ vars.CLOUDFLARE_ZONE_ID || '2b270ffb21b7f98a39960abb6bf953ae' }}
          ALL: ${{ inputs.everything }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set — nothing purged."
            echo "See the setup steps at the top of this workflow file."
            exit 0
          fi
          if [ "$ALL" = "true" ]; then
            echo "purging the entire zone"
            body='{"purge_everything":true}'
          else
            echo "purging the two files that cannot carry a cache key"
            body='{"files":[
              "https://merecatholicity.com/sw.js",
              "https://merecatholicity.com/version.json",
              "https://www.merecatholicity.com/sw.js",
              "https://www.merecatholicity.com/version.json"
            ]}'
          fi
          resp=$(curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZONE}/purge_cache" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$body")
          echo "$resp"
          python3 -c "import json,sys;d=json.loads(sys.argv[1]);sys.exit(0 if d.get('success') else 1)" "$resp"
