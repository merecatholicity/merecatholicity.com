# Purge the Cloudflare edge — but only once GitHub Pages is actually serving
# the new build.
#
# This replaces a manual step that was run by hand after every deploy, and it
# encodes the trap that made that step dangerous: purging BEFORE Pages has
# finished publishing re-caches the OLD bytes, and for a URL Cloudflare treats
# as immutable that freezes the rollout until the key is bumped again. So this
# never purges on a timer or on a push — it waits until the origin itself
# reports the expected build id, then purges.
#
# Almost nothing needs purging any more: every asset carries a content-hash key
# (scripts/stamp_versions.py), and Cloudflare does not edge-cache the HTML
# (cf-cache-status: DYNAMIC, measured). What is left is the two files that
# cannot carry a key — sw.js, whose URL is its registration identity, and
# version.json, which is the answer to "what is current" and so must never be
# served from the cache it describes.
#
# SETUP (one time, by the repository owner):
#   1. Cloudflare → My Profile → API Tokens → Create Token, with the single
#      permission  Zone → Cache Purge → Purge  on merecatholicity.com.
#   2. Repo → Settings → Secrets and variables → Actions → New secret:
#        CLOUDFLARE_API_TOKEN   the token from step 1
#        CLOUDFLARE_ZONE_ID     the zone id from the Cloudflare dashboard
# Until both exist this workflow skips cleanly rather than failing, so the
# repository is never red for a feature that has not been switched on.

name: Purge Cloudflare after Pages publishes

on:
  # Pages is deployed from a branch here (main /docs), so there is no deploy
  # workflow to chain onto. page_build is GitHub's own signal that the Pages
  # build finished.
  page_build:
  # And a manual button, for the times a purge is wanted without a deploy.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A rapid second deploy should supersede a purge still waiting on the first:
  # the later build is the one worth confirming.
  group: purge-cache
  cancel-in-progress: true

jobs:
  purge:
    # A failed Pages build has nothing to purge for.
    if: github.event_name == 'workflow_dispatch' || github.event.build.status == 'built'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the build id this commit expects
        id: expect
        run: |
          build=$(python3 -c "import json;print(json.load(open('docs/version.json'))['build'])")
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "expecting build $build"

      - name: Wait for the origin to serve it
        id: wait
        run: |
          # A THROWAWAY query string on every probe. Fetching the real URL while
          # Pages is mid-publish is what caches the old bytes under the new key.
          for i in $(seq 1 60); do
            got=$(curl -fsS "https://merecatholicity.com/version.json?probe=${GITHUB_RUN_ID}-$i" \
                  | python3 -c "import json,sys;print(json.load(sys.stdin).get('build',''))" 2>/dev/null || true)
            if [ "$got" = "${{ steps.expect.outputs.build }}" ]; then
              echo "origin is serving ${got} after ${i} checks"
              echo "ready=yes" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::origin never reported build ${{ steps.expect.outputs.build }}; not purging"
          echo "ready=no" >> "$GITHUB_OUTPUT"

      - name: Purge the two files that cannot carry a cache key
        if: steps.wait.outputs.ready == 'yes'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ZONE" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID not set — skipping the purge."
            echo "Everything except sw.js and version.json is content-keyed, so the"
            echo "only cost of skipping is that those two heal on their 10-minute TTL."
            exit 0
          fi
          resp=$(curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZONE}/purge_cache" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":[
              "https://merecatholicity.com/sw.js",
              "https://merecatholicity.com/version.json",
              "https://www.merecatholicity.com/sw.js",
              "https://www.merecatholicity.com/version.json"
            ]}')
          echo "$resp"
          python3 -c "import json,sys;d=json.loads(sys.argv[1]);sys.exit(0 if d.get('success') else 1)" "$resp"

      - name: Confirm the edge agrees with the origin
        if: steps.wait.outputs.ready == 'yes'
        run: |
          sleep 5
          edge=$(curl -fsS "https://merecatholicity.com/version.json" \
                 | python3 -c "import json,sys;print(json.load(sys.stdin).get('build',''))")
          echo "edge is serving $edge"
          if [ "$edge" != "${{ steps.expect.outputs.build }}" ]; then
            echo "::warning::edge still serving ${edge}; it will heal on the 10-minute TTL"
          fi
